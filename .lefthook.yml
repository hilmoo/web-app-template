# yaml-language-server: $schema=https://lefthook.dev/schema.json
#
# Skip once with `git commit --no-verify` / `git push --no-verify` or LEFTHOOK=0.

pre-commit:
  parallel: true
  jobs:
    - name: go lint + format
      glob: "core/**/*.go"
      root: core/
      run: golangci-lint run && golangci-lint fmt --diff

    - name: oxlint
      glob: "{frontend,migration}/**/*.{ts,tsx}"
      exclude: "**/*.gen.ts"
      run: pnpm exec oxlint {staged_files}

    - name: oxfmt
      glob: "{frontend,migration}/**/*.{ts,tsx,json}"
      exclude: "**/*.gen.ts"
      run: pnpm exec oxfmt --check {staged_files}