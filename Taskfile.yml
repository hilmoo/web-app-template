# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

includes:
  migration:
    taskfile: migration/Taskfile.yml
    dir: migration
  openapi:
    taskfile: openapi/Taskfile.yml
    dir: openapi
  core:
    taskfile: core/Taskfile.yml
    dir: core
  frontend:
    taskfile: frontend/Taskfile.yml
    dir: frontend
  proto:
    taskfile: proto/Taskfile.yml
    dir: proto

tasks:
  dev:
    desc: Start core + frontend in a zellij session
    cmds:
      - task: dev:kill
      - defer: zellij attach dev
      - zellij --session dev --new-session-with-layout zellij-dev.kdl

  dev:kill:
    desc: Kill the dev session and any orphaned watchers/servers
    ignore_error: true
    cmds:
      - zellij delete-session dev --force
      # core
      - pkill -f 'watchexec -w internal' || true
      - pkill -f '\.bin/main\.bin serve' || true
      # frontend
      - pkill -f 'vite\.js dev --port 3000' || true

  gen-all:
    desc: Generate everything (migration -> typespec -> openapi -> proto -> codegen)
    cmds:
      - task: gen-sql
      - task: gen-api

  gen-sql:
    desc: Generate SQL migration files from the drizzle schema
    cmds:
      - protoforge run migration
      - task: core:gen-sql

  gen-api:
    desc: Generate TypeSpec, OpenAPI and proto files
    cmds:
      - protoforge run typespec openapi proto
      - task: frontend:orval

  lint:
    desc: Lint core and frontend
    cmds:
      - task: core:lint
      - task: frontend:lint

  build:
    desc: Build the frontend and embed it into the core binary
    cmds:
      - task: frontend:build
      - task: core:build
