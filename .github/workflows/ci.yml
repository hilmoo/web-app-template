# The same checks run locally via lefthook (`task check` on pre-push), see lefthook.yml.
# If GitHub Actions is unavailable for a project, delete this file and rely on lefthook.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    name: Go (lint, format, sqlc, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: core/go.mod
          cache-dependency-path: |
            core/go.sum
            proto/gen/go/go.sum

      - name: Lint (golangci-lint)
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13.1
          working-directory: core

      - name: Check formatting (golangci-lint fmt)
        working-directory: core
        run: golangci-lint fmt --diff

      # Fails if core/internal/gen/sqlc is out of date with core/internal/db/sql.
      - uses: sqlc-dev/setup-sqlc@v4
        with:
          sqlc-version: 1.31.1

      - name: Check sqlc generated code
        working-directory: core
        run: sqlc diff

      - name: Test
        working-directory: core
        run: go test ./...

      - name: Build
        working-directory: core
        run: go build ./...

  ts:
    name: TypeScript lint & format (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [frontend, migration]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v3

      - run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Lint (oxlint)
        run: pnpm exec oxlint

      - name: Check formatting (oxfmt)
        run: pnpm exec oxfmt --check

  frontend:
    name: Frontend (typecheck, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v3

      - run: pnpm install --frozen-lockfile

      # proto/gen/typescript/dist is generated, not committed.
      - name: Build proto package
        run: pnpm --filter proto build

      - name: Typecheck
        working-directory: frontend
        run: pnpm typecheck

      - name: Test
        working-directory: frontend
        run: pnpm test

      - name: Build
        working-directory: frontend
        run: pnpm build

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build .
