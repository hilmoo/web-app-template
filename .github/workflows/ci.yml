# The same checks run locally via lefthook (`task check` on pre-push), see lefthook.yml.
# If GitHub Actions is unavailable for a project, delete this file and rely on lefthook.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    name: Go (lint, format, sqlc, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: core/go.mod
          cache-dependency-path: |
            core/go.sum
            proto/gen/go/go.sum

      - name: Lint (golangci-lint)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          working-directory: core

      - name: Check formatting (golangci-lint fmt)
        working-directory: core
        run: golangci-lint fmt --diff

      # Fails if core/internal/gen/sqlc is out of date with core/internal/db/sql.
      - uses: sqlc-dev/setup-sqlc@v5
        with:
          sqlc-version: 1.31.1

      - name: Check sqlc generated code
        working-directory: core
        run: sqlc diff

      - name: Test
        working-directory: core
        run: go test ./...

      - name: Build
        working-directory: core
        run: go build ./...

  ts:
    name: TypeScript lint & format (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [frontend, migration]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v3

      - run: pnpm install --frozen-lockfile
        working-directory: .

      # Type-aware lint resolves `proto/*` imports from the generated dist, which isn't committed.
      - name: Build proto package
        run: pnpm --filter proto build
        working-directory: .

      # oxlint/oxfmt are installed via devbox locally, not as package deps.
      # Versions are pinned to match devbox.jsonc (renovate keeps them in sync).
      # tsgolint powers type-aware rules (e.g. typescript/no-deprecated) and is found on PATH.
      - name: Lint (oxlint)
        run: pnpm dlx --package oxlint@1.88.0 --package oxlint-tsgolint@7.0.2004 oxlint

      - name: Check formatting (oxfmt)
        run: pnpm dlx oxfmt@0.73.0 --check

  frontend:
    name: Frontend (typecheck, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v3

      - run: pnpm install --frozen-lockfile

      # proto/gen/typescript/dist is generated, not committed.
      - name: Build proto package
        run: pnpm --filter proto build

      - name: Typecheck
        working-directory: frontend
        run: pnpm typecheck

      - name: Test
        working-directory: frontend
        run: pnpm test

      - name: Build
        working-directory: frontend
        run: pnpm build

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build .

  # Single aggregate check: mark only "CI OK" as required in branch protection.
  ci-ok:
    name: CI OK
    runs-on: ubuntu-latest
    if: always()
    needs: [go, ts, frontend, docker]
    steps:
      - name: Fail if any required job did not succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
