# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

includes:
  node-common:
    taskfile: ../.task/node-common.yml
    flatten: true
    dir: .

tasks:
  default:
    desc: Start the development server
    cmds:
      - pnpm dev

  build:
    desc: Production build into dist/
    cmds:
      - pnpm build

  orval:
    desc: Generate zod schemas from the OpenAPI document using Orval
    cmds:
      - rm -rf src/api
      - pnpm exec orval

  test:
    desc: Run unit tests (vitest)
    cmds:
      - pnpm test
