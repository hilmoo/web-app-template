# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

tasks:
  default:
    desc: Start the development server
    cmds:
      - pnpm dev

  build:
    desc: Production build into dist/
    cmds:
      - pnpm build

  typecheck:
    desc: Type-check the project
    cmds:
      - pnpm typecheck

  lint:
    desc: Run linters
    cmds:
      - pnpm exec oxlint --fix

  lint:check:
    desc: Lint without modifying files
    cmds:
      - pnpm exec oxlint

  fmt:
    desc: Run formatters
    cmds:
      - pnpm exec oxfmt

  fmt:check:
    desc: Check formatting without modifying files
    cmds:
      - pnpm exec oxfmt --check

  orval:
    desc: Generate zod schemas from the OpenAPI document using Orval
    cmds:
      - rm -rf src/api
      - pnpm exec orval

  test:
    desc: Run unit tests (vitest)
    cmds:
      - pnpm test
