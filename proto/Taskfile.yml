# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

tasks:
  default:
    desc: Buf generate (Go + TypeScript)
    cmds:
      - find gen/go -mindepth 1 ! -path gen/go/go.mod ! -path gen/go/go.sum -delete
      - rm -rf gen/typescript/src
      - rm -rf gen/typescript/dist
      - buf generate
      - task: gen-go-inject-tags
      - task: build-typescript

  gen-go-inject-tags:
    desc: "Inject go tags (validate:...) into protobuf files"
    cmds:
      - for d in models/v1 services/v1; do (cd gen/go/$d && protoc-go-inject-tag -input="*.pb.go"); done

  build-typescript:
    desc: build typescript code
    dir: gen/typescript
    cmds:
      - pnpm run build
