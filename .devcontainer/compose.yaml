services:
  workspace:
    image: ghcr.io/hilmoo/containers/my-devcontainer:2026.10.17
    environment:
      # Set NIX_REMOTE=daemon in .devcontainer/.env when /nix is the host's (daemon mode).
      NIX_REMOTE: ${NIX_REMOTE:-}
    volumes:
      - ../..:/workspaces:cached
      # Named volume by default; set NIX_MOUNT_SOURCE=/nix in .devcontainer/.env to use the host's nix.
      - ${NIX_MOUNT_SOURCE:-shared-nix-my-devcontainer-2026.10.17}:/nix
    command: sleep infinity

  db:
    image: postgres:18-trixie
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: web-app-template
    volumes:
      - web-app-template-postgres:/var/lib/postgresql/18/docker
    network_mode: service:workspace

volumes:
  web-app-template-postgres:
  shared-nix-my-devcontainer-2026.10.17:
    name: ${NIX_VOLUME_NAME:-shared-nix-my-devcontainer-2026.10.17}
    external: true
